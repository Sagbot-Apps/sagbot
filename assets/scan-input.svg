<svg xmlns="http://www.w3.org/2000/svg" width="640" height="72" viewBox="0 0 640 72" role="img" aria-labelledby="t">
  <title id="t">Enter your domain at sagbot.app and scan it</title>
  <style>
    text { font: 500 20px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { fill: #fff; stroke: #dfe1e8; }
    .prefix { fill: #625f70; }
    .hint { fill: #8e8b9a; }
    .caret { fill: #0e0b1a; animation: blink 1.1s steps(1) infinite; }
    .go { fill: #ff5e1f; }
    .label { fill: #fff; font-weight: 700; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #2a2a2a; stroke: #3c3936; }
      .prefix { fill: #9a9390; }
      .hint { fill: #7d7774; }
      .caret { fill: #f0e3de; }
    }
  </style>
  <rect class="bar" x="4.5" y="4.5" width="631" height="63" rx="16" />
  <text x="22" y="43"><tspan class="prefix">https://</tspan><tspan class="caret">|</tspan><tspan class="hint">yourdomain.com</tspan></text>
  <rect class="go" x="524" y="12" width="104" height="48" rx="10" />
  <text class="label" x="576" y="43" text-anchor="middle">Scan</text>
</svg>
